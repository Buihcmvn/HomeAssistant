<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT TELEMETRY & CONTROL SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.4.0/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
        }

        header h2 {
            margin: 0;
            font-size: 16px;
            letter-spacing: 1px;
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        /* Default layout: 1 column for portrait mobile */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 1200px;
            margin: auto;
        }

        /* Automatically switch to 2 columns on larger screens or when mobile device is rotated to LANDSCAPE */
        @media (min-width: 768px), (orientation: landscape) {
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .tech-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 12px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 6px;
        }

        .stream-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .stream-box {
            width: 100%;
            display: block;
            max-height: 280px;
            object-fit: contain;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .hud-item {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 6px;
            border-radius: 4px;
            text-align: center;
        }

        .hud-label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-green);
            margin-top: 2px;
        }

        .dpad-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px 0;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            grid-template-rows: repeat(3, 55px);
            gap: 5px;
        }

        .btn {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:active, .btn.active {
            background: var(--accent-blue);
            border-color: #60a5fa;
            transform: scale(0.95);
        }

        .btn-danger {
            background: #7f1d1d;
            border-color: #991b1b;
        }
        .btn-danger:active {
            background: var(--accent-red);
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            font-size: 11px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-blue);
            background: #1f2937;
        }

        /* Toggle switch design */
        .auto-mode-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { 
            opacity: 0; 
            width: 0; 
            height: 0; 
        }

        .slider-toggle {
            position: absolute; 
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: .3s;
            border-radius: 22px;
        }

        .slider-toggle:before {
            position: absolute; 
            content: "";
            height: 16px; 
            width: 16px;
            left: 3px; 
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider-toggle { 
            background-color: var(--accent-green); 
        }

        input:checked + .slider-toggle:before { 
            transform: translateX(22px); 
        }

        .servo-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 5px;
        }

        .btn-servo {
            background: #065f46;
            border-color: #047857;
            font-size: 11px;
            padding: 8px;
            color: var(--text-main);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-servo:active {
            background: var(--accent-green);
        }

        .servo-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h2>⚙ Autonomous Robot Command & Telemetry Center</h2>
</header>

<div class="dashboard-grid">
    
    <!-- LEFT COLUMN: CAMERA STREAM & HUD TELEMETRY -->
    <div class="tech-panel">
        <div class="panel-title">Live Video Feed & Real-time Telemetry</div>
        
        <!-- Added ID and onerror auto-reconnection handler for mobile browsers -->
        <div class="stream-container">
            <img id="videoStream" src="/video_feed" class="stream-box" alt="Connecting to Camera..." onerror="reloadStream(this)">
        </div>

        <!-- HUD telemetry grid -->
        <div class="hud-grid">
            <div class="hud-item">
                <div class="hud-label">Status</div>
                <div class="hud-value" id="status-text">STOP</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Servo Tilt</div>
                <div class="hud-value" id="pos-text">1100</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Servo Canon</div>
                <div class="hud-value" id="gpos-text">1400</div>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN: MOTOR DRIVE & ACTUATORS -->
    <div class="tech-panel">
        <div class="panel-title">Motion Drive & Actuators</div>

        <!-- Speed control slider -->
        <div class="control-group">
            <label>PWM MOTOR SPEED: <span id="speed-text" style="color: var(--accent-green);">60</span>%</label>
            <input type="range" id="speedRange" min="20" max="100" value="60">
        </div>

        <!-- Auto Mode toggle switch -->
        <div class="auto-mode-container">
            <span style="font-size: 11px; font-weight: bold; color: var(--text-main);">AUTO AVOIDANCE MODE</span>
            <label class="switch">
                <input type="checkbox" id="autoToggle" onchange="toggleAutoMode(this)">
                <span class="slider-toggle"></span>
            </label>
        </div>

        <!-- D-Pad Directional Controls -->
        <div class="dpad-wrapper">
            <div class="dpad">
                <div></div>
                <button class="btn" onmousedown="sendMove('FORWARD')" onmouseup="sendStop()" ontouchstart="sendMove('FORWARD')" ontouchend="sendStop()">▲</button>
                <div></div>
                <button class="btn" onmousedown="sendMove('LEFT')" onmouseup="sendStop()" ontouchstart="sendMove('LEFT')" ontouchend="sendStop()">◄</button>
                <button class="btn btn-danger" onclick="sendStop()">■</button>
                <button class="btn" onmousedown="sendMove('RIGHT')" onmouseup="sendStop()" ontouchstart="sendMove('RIGHT')" ontouchend="sendStop()">►</button>
                <div></div>
                <button class="btn" onmousedown="sendMove('BACKWARD')" onmouseup="sendStop()" ontouchstart="sendMove('BACKWARD')" ontouchend="sendStop()">▼</button>
                <div></div>
            </div>
        </div>

        <!-- Servo Controls -->
        <div class="control-group" style="margin-top: 10px;">
            <label>CAMERA TILT (UP / DOWN)</label>
            <div class="servo-container">
                <button class="btn-servo" onclick="sendServoTilt('up')">▲ Tilt Up</button>
                <button class="btn-servo" onclick="sendServoTilt('down')">▼ Tilt Down</button>
            </div>
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <label>CANON SERVO (AUTO-CENTER AFTER 3S)</label>
            <div class="servo-row">
                <button class="btn-servo" onclick="sendServoCanon('left')">◀ Canon Left</button>
                <button class="btn-servo" onclick="sendServoCanon('right')">Canon Right ▶</button>
            </div>
        </div>
    </div>

</div>

<script>
    const socket = io();
    const speedSlider = document.getElementById('speedRange');
    let currentDir = 'STOP';

    // Auto-reconnection function for mobile video stream if connection drops
    function reloadStream(img) {
        setTimeout(() => {
            let timestamp = new Date().getTime();
            img.src = "/video_feed?t=" + timestamp;
        }, 1000);
    }

    let throttleTimer;
    speedSlider.oninput = function() {
        document.getElementById('speed-text').innerText = this.value;
        if (throttleTimer) return;
        throttleTimer = setTimeout(() => {
            throttleTimer = null;
            if(currentDir !== 'STOP') {
                sendMove(currentDir);
            }
        }, 100); 
    }

    function sendMove(dir) {
        currentDir = dir;
        socket.emit('move', { dir: dir, speed: parseInt(speedSlider.value) });
    }

    function sendStop() {
        currentDir = 'STOP';
        socket.emit('stop');
    }

    function toggleAutoMode(checkbox) {
        const isAuto = checkbox.checked;
        socket.emit('toggle_auto', { auto: isAuto });
    }

    function sendServoTilt(action) {
        socket.emit('servo_tilt', { action: action });
    }

    function sendServoCanon(position) {
        socket.emit('servo_canon', { position: position });
    }

    socket.on('status_update', (data) => {
        document.getElementById('status-text').innerText = data.dir;
        document.getElementById('speed-text').innerText = data.speed;
        document.getElementById('pos-text').innerText = data.pos;
        document.getElementById('gpos-text').innerText = data.gpos;
    });
</script>

</body>
</html>
