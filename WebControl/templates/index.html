<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROBOT TELEMETRY & CONTROL SYSTEM</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent-green: #10b981;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 1px;
            color: var(--accent-blue);
            text-transform: uppercase;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: auto;
        }

        @media (max-width: 850px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .tech-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .panel-title {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            border-left: 3px solid var(--accent-blue);
            padding-left: 8px;
        }

        .stream-container {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .stream-box {
            width: 100%;
            display: block;
        }

        .hud-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .hud-item {
            background: #0f172a;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 4px;
            text-align: center;
        }

        .hud-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .hud-value {
            font-size: 14px;
            font-weight: bold;
            color: var(--accent-green);
            margin-top: 2px;
        }

        .dpad-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 15px 0;
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 6px;
        }

        .btn {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn:active, .btn.active {
            background: var(--accent-blue);
            border-color: #60a5fa;
            transform: scale(0.95);
        }

        .btn-danger {
            background: #7f1d1d;
            border-color: #991b1b;
        }
        .btn-danger:active {
            background: var(--accent-red);
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            font-size: 12px;
            color: var(--text-muted);
            display: block;
            margin-bottom: 5px;
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--accent-blue);
            background: #1f2937;
        }

        .servo-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-servo {
            background: #065f46;
            border-color: #047857;
            font-size: 13px;
            padding: 10px;
            color: var(--text-main);
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-servo:active {
            background: var(--accent-green);
        }

        .servo-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    <h2>⚙ Autonomous Robot Command & Telemetry Center</h2>
</header>

<div class="dashboard-grid">
    
    <!-- CỘT TRÁI: CAMERA STREAM & HUD TELEMETRY -->
    <div class="tech-panel">
        <div class="panel-title">Live Video Feed & Real-time Telemetry</div>
        
        <div class="stream-container">
            <img src="/video_feed" class="stream-box" alt="Live Feed Error">
        </div>

        <!-- Bảng HUD thông số -->
        <div class="hud-grid">
            <div class="hud-item">
                <div class="hud-label">Status</div>
                <div class="hud-value" id="status-text">STOP</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Servo Tilt</div>
                <div class="hud-value" id="pos-text">1100</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">Servo Canon</div>
                <div class="hud-value" id="gpos-text">1400</div>
            </div>
        </div>
    </div>

    <!-- CỘT PHẢI: ĐIỀU KHIỂN ĐỘNG CƠ & SERVO -->
    <div class="tech-panel">
        <div class="panel-title">Motion Drive & Actuators</div>

        <!-- Thanh chỉnh tốc độ -->
        <div class="control-group">
            <label>PWM MOTOR SPEED: <span id="speed-text" style="color: var(--accent-green);">60</span>%</label>
            <input type="range" id="speedRange" min="20" max="100" value="60">
        </div>

        <!-- D-Pad Điều hướng -->
        <div class="dpad-wrapper">
            <div class="dpad">
                <div></div>
                <button class="btn" onmousedown="sendMove('FORWARD')" onmouseup="sendStop()" ontouchstart="sendMove('FORWARD')" ontouchend="sendStop()">▲</button>
                <div></div>
                <button class="btn" onmousedown="sendMove('LEFT')" onmouseup="sendStop()" ontouchstart="sendMove('LEFT')" ontouchend="sendStop()">◄</button>
                <button class="btn btn-danger" onclick="sendStop()">■</button>
                <button class="btn" onmousedown="sendMove('RIGHT')" onmouseup="sendStop()" ontouchstart="sendMove('RIGHT')" ontouchend="sendStop()">►</button>
                <div></div>
                <button class="btn" onmousedown="sendMove('BACKWARD')" onmouseup="sendStop()" ontouchstart="sendMove('BACKWARD')" ontouchend="sendStop()">▼</button>
                <div></div>
            </div>
        </div>

        <!-- Điều khiển Servo -->
        <div class="control-group" style="margin-top: 20px;">
            <label>CAMERA TILT (UP / DOWN)</label>
            <div class="servo-container">
                <button class="btn-servo" onclick="sendServoTilt('up')">▲ Tilt Up</button>
                <button class="btn-servo" onclick="sendServoTilt('down')">▼ Tilt Down</button>
            </div>
        </div>

        <div class="control-group" style="margin-top: 15px;">
            <label>CANON SERVO (AUTO-CENTER AFTER 3S)</label>
            <div class="servo-row">
                <button class="btn-servo" onclick="sendServoCanon('left')">◀ Canon Left</button>
                <button class="btn-servo" onclick="sendServoCanon('right')">Canon Right ▶</button>
            </div>
        </div>
    </div>

</div>

<script>
    const socket = io();
    const speedSlider = document.getElementById('speedRange');
    let currentDir = 'STOP';

    speedSlider.oninput = function() {
        document.getElementById('speed-text').innerText = this.value;
        if(currentDir !== 'STOP') {
            sendMove(currentDir);
        }
    }

    function sendMove(dir) {
        currentDir = dir;
        socket.emit('move', { dir: dir, speed: parseInt(speedSlider.value) });
    }

    function sendStop() {
        currentDir = 'STOP';
        socket.emit('stop');
    }

    function sendServoTilt(action) {
        socket.emit('servo_tilt', { action: action });
    }

    function sendServoCanon(position) {
        socket.emit('servo_canon', { position: position });
    }

    socket.on('status_update', (data) => {
        document.getElementById('status-text').innerText = data.dir;
        document.getElementById('speed-text').innerText = data.speed;
        document.getElementById('pos-text').innerText = data.pos;
        document.getElementById('gpos-text').innerText = data.gpos;
    });
</script>

</body>
</html>
